[package]
name = "kubectl-view-rngd"
version = "0.1.0"
edition = "2024"
description = "kubectl plugin that visualizes furiosa.ai/rngd allocation across nodes"
license = "Apache-2.0"
publish = false

[[bin]]
name = "kubectl-view-rngd"
path = "src/main.rs"

[lib]
name = "kubectl_view_rngd"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
comfy-table = "7.2.2"
k8s-openapi = { version = "0.27.1", features = ["latest"] }
kube = { version = "3.1.0", default-features = false, features = ["client", "rustls-tls"] }
rustls = { version = "0.23.38", default-features = false, features = ["ring", "std"] }
thiserror = "2.0.18"
tokio = { version = "1.52.1", default-features = false, features = ["rt-multi-thread", "macros"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[dev-dependencies]
serde_json = "1.0.149"
